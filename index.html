<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Connecta — Shape Match Game</title>
    <meta name="description" content="Connecta - Şekilleri çizerek birbirine bağla! Connect shapes by drawing lines!">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a1a">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
</head>

<body>
    <canvas id="game-canvas"></canvas>

    <!-- HUD -->
    <div id="hud">
        <button class="hud-btn" id="btn-home" title="Main Menu">🏠</button>
        <div class="hud-level" id="hud-level">Level 1</div>
        <div class="hud-score" id="hud-score">⭐ 0</div>
        <div class="hud-timer" id="hud-timer">1:00</div>
        <div class="hud-lives" id="hud-lives">
            <span class="heart alive">❤️</span>
            <span class="heart alive">❤️</span>
            <span class="heart alive">❤️</span>
        </div>
    </div>

    <!-- MAIN MENU -->
    <div class="screen active" id="menu-screen">
        <div class="menu-star-counter" id="menu-stars">★ 0</div>
        <div class="game-title">Connecta</div>
        <div class="menu-shapes">
            <span>⬟</span>
            <span>●</span>
            <span>▲</span>
            <span>★</span>
            <span>◆</span>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" id="btn-start" data-i18n="start">Başla</button>
            <button class="btn btn-secondary" id="btn-levels" data-i18n="levels">Leveller</button>
            <button class="btn btn-secondary" id="btn-shop" data-i18n="shop">Mağaza</button>
            <button class="btn btn-secondary" id="btn-settings" data-i18n="settings">Ayarlar</button>
        </div>
    </div>

    <!-- LEVEL SELECT -->
    <div class="screen" id="level-screen">
        <div class="screen-heading" data-i18n="levelSelect">Level Seç</div>
        <div class="game-subtitle" data-i18n="levelSelectSub">Başlamak istediğin leveli seç</div>
        <div class="level-grid" id="level-grid"></div>
        <button class="btn btn-secondary" id="btn-back-menu" data-i18n="backToMenu">Ana Menü</button>
    </div>

    <!-- SETTINGS -->
    <div class="screen" id="settings-screen">
        <div class="screen-heading" data-i18n="settingsTitle">Ayarlar</div>
        <div class="settings-section">
            <div class="settings-label" data-i18n="language">Dil</div>
            <div class="lang-buttons">
                <button class="btn btn-lang" id="btn-lang-tr" data-lang="tr">🇹🇷 Türkçe</button>
                <button class="btn btn-lang" id="btn-lang-en" data-lang="en">🇬🇧 English</button>
            </div>
        </div>
        <button class="btn btn-secondary" id="btn-settings-back" data-i18n="back">← Geri</button>
    </div>

    <!-- SHOP -->
    <div class="screen" id="shop-screen">
        <div class="screen-heading" data-i18n="shopTitle">Mağaza</div>
        <div class="shop-stars" id="shop-stars">★ 0</div>
        <div class="shop-grid" id="shop-grid"></div>
        <button class="btn btn-secondary" id="btn-shop-back" data-i18n="backToMenu">Ana Menü</button>
    </div>

    <!-- LEVEL COMPLETE -->
    <div class="screen" id="complete-screen">
        <div class="complete-title" id="complete-level">Level 1 Tamamlandı!</div>
        <div class="stars-container" id="complete-stars"></div>
        <div class="complete-time" id="complete-time">Kalan Süre: 45s</div>
        <div class="complete-score" id="complete-score">Skor: 0</div>
        <div class="btn-group">
            <button class="btn btn-success" id="btn-next-level" data-i18n="nextLevel">Sonraki Level →</button>
            <button class="btn btn-primary" id="btn-replay-complete" data-i18n="playAgain">Tekrar Oyna</button>
            <button class="btn btn-secondary" id="btn-complete-menu" data-i18n="mainMenu">Ana Menü</button>
        </div>
    </div>

    <!-- GAME OVER -->
    <div class="screen" id="gameover-screen">
        <div class="gameover-title" data-i18n="gameOver">Oyun Bitti!</div>
        <div class="gameover-subtitle" id="gameover-level">Level 1</div>
        <div class="btn-group">
            <button class="btn btn-danger" id="btn-retry" data-i18n="retry">Tekrar Dene</button>
            <button class="btn btn-secondary" id="btn-gameover-menu" data-i18n="mainMenu">Ana Menü</button>
        </div>
    </div>

    <!-- ALL LEVELS COMPLETE -->
    <div class="screen" id="allcomplete-screen">
        <div class="allcomplete-title" data-i18n="allComplete">� Tebrikler!</div>
        <div class="allcomplete-subtitle" data-i18n="allCompleteSub">Tüm levelleri tamamladın!</div>
        <button class="btn btn-primary" id="btn-allcomplete-menu" data-i18n="mainMenu">Ana Menü</button>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/shapes.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>

</html>
